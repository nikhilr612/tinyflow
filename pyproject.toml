[project]
name = "tinyflow"
version = "0.1.0"
description = "A short and sweet implementation of generative flow models."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beartype>=0.22.4",
    "einops>=0.8.1",
    "equinox>=0.13.2",
    "grain>=0.2.14",
    "jax[cuda13]>=0.8.0",
    "jaxtyping>=0.3.3",
    "optax>=0.2.6",
    "typer-slim>=0.20.0",
]

[tool.ruff.lint]
ignore = ['F722']
